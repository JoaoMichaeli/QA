<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Login - Sistema de Testes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Usuário<input type="text" id="username" required></label>
      <label>Senha<input type="password" id="password" required></label>
      <button type="submit" class="btn">Entrar</button>
    </form>
    <p class="note">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    <div id="msg" class="msg"></div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
